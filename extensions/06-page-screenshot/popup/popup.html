<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../ui.css"></head>
<body class="popup stack">
  <h1>Snap</h1>
  <button class="wide primary" data-mode="full">Full page <span class="muted small">Alt+Shift+S</span></button>
  <button class="wide" data-mode="visible">Visible area <span class="muted small">Alt+Shift+V</span></button>
  <button class="wide" data-mode="area">Select an area…</button>
  <div class="muted small" id="msg">Full page: Chrome briefly shows “started debugging this browser” – that is how the whole page is captured in one shot.</div>
  <script src="popup.js"></script>
</body>
</html>
