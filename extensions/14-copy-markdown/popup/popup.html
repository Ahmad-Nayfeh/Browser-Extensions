<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../ui.css"><style>body.popup{width:460px} textarea{height:260px}</style></head>
<body class="popup stack">
  <div class="row"><h1>Copy as Markdown</h1><span class="muted small" id="what"></span></div>
  <div class="row">
    <span><button id="mSel">Selection</button> <button id="mPage">Whole article</button></span>
    <label class="small"><input type="checkbox" id="header"> Title &amp; link</label>
  </div>
  <textarea id="out" spellcheck="false" readonly></textarea>
  <div class="row">
    <span class="muted small">Shortcut <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> · or right-click</span>
    <span><button id="dl">Download .md</button> <button class="primary" id="copy">Copy</button></span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
