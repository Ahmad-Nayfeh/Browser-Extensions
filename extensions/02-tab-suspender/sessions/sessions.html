<!doctype html>
<html>
<head><meta charset="utf-8"><title>Saved tabs</title><link rel="stylesheet" href="../ui.css">
<style>
  .group { margin-bottom: 16px; }
  .group a { color: var(--fg); text-decoration: none; display: flex; gap: 8px; align-items: center; min-width: 0; }
  .group a:hover { color: var(--accent); }
  .group a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group img { width: 16px; height: 16px; flex: none; }
  .x { border: 0; background: none; color: var(--muted); padding: 2px 6px; }
</style></head>
<body class="page">
  <div class="row"><h1>Saved tabs</h1><span class="muted" id="total"></span></div>
  <p class="muted small">Click a link to open it (it is removed from the list). Saved tabs use no memory at all.</p>
  <div id="groups"></div>
  <script src="sessions.js"></script>
</body>
</html>
