<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../ui.css"></head>
<body class="popup stack">
  <h1>No Cookies</h1>
  <div class="muted small" id="title"></div>
  <div class="card row">
    <div><b>Active on <span id="host">this site</span></b><div class="muted small">Turn off if a site breaks</div></div>
    <label class="switch"><input type="checkbox" id="site"><span></span></label>
  </div>
  <div class="card row">
    <div><b>Click “Reject all” automatically</b><div class="muted small">Off = only hide banners</div></div>
    <label class="switch"><input type="checkbox" id="auto"><span></span></label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
