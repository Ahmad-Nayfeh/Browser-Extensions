<!doctype html>
<html>
<head><meta charset="utf-8"><title>Blueprint report</title><link rel="stylesheet" href="ui.css">
<style>
  body.page { max-width: 1150px; }
  .grid { display: grid; grid-template-columns: 1fr 280px; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  textarea { height: 70vh; font-size: 12px; }
  .shots { max-height: 70vh; overflow: auto; display: grid; gap: 10px; }
  .shots figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .shots img { width: 100%; display: block; }
  .shots figcaption { font-size: 11px; padding: 4px 6px; color: var(--muted); }
</style></head>
<body class="page stack">
  <div class="row"><h1 id="title">Blueprint</h1><span class="muted small" id="stats"></span></div>
  <div class="row" style="justify-content:flex-start;gap:8px">
    <button class="primary" id="zip">Download everything (.zip)</button>
    <button id="dlMd">Report only (.md)</button>
    <button id="copy">Copy Markdown</button>
  </div>
  <p class="muted small">Give Claude the .zip (report + screenshots) and ask, for example: “Restyle my site to match this design.”</p>
  <div class="grid">
    <textarea id="md" readonly spellcheck="false"></textarea>
    <div class="shots" id="shots"></div>
  </div>
  <script src="idb.js"></script>
  <script src="zip.js"></script>
  <script src="report.js"></script>
</body>
</html>
