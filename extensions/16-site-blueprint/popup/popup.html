<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../ui.css"></head>
<body class="popup stack">
  <h1>Blueprint</h1>
  <div class="muted small">Exports everything about this page's front-end into one Markdown file you can give to Claude.</div>

    <label class="row"><span>Include the full CSS</span><input type="checkbox" id="css"></label>

  <script src="popup.js"></script>

</html>
